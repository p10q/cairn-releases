name: Deploy updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Assemble updates with the verified release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=cairn/release-asset.json
          asset_tag="$(jq -er '.tag' "$manifest")"
          asset_name="$(jq -er '.name' "$manifest")"
          asset_sha="$(jq -er '.sha256' "$manifest")"
          asset_length="$(jq -er '.length' "$manifest")"
          [[ "$asset_tag" =~ ^macos-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$asset_name" =~ ^Cairn-[0-9]+\.[0-9]+\.[0-9]+\.dmg$ ]]
          [[ "$asset_sha" =~ ^[a-f0-9]{64}$ ]]
          [[ "$asset_length" =~ ^[0-9]+$ ]]
          asset_dir="$RUNNER_TEMP/cairn-release-asset"
          mkdir -p "$asset_dir" _site
          gh release download "$asset_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset_name" --dir "$asset_dir"
          asset_file="$asset_dir/$asset_name"
          [[ "$(stat -c %s "$asset_file")" == "$asset_length" ]]
          printf '%s  %s\n' "$asset_sha" "$asset_file" | sha256sum --check -
          git archive HEAD | tar --exclude='.github' -x -C _site
          while IFS= read -r destination; do
            [[ "$destination" == cairn/Cairn-latest.dmg ||
              "$destination" =~ ^[a-f0-9]{64}/Cairn-[0-9]+\.[0-9]+\.[0-9]+\.dmg$ ]]
            mkdir -p "_site/$(dirname "$destination")"
            cp "$asset_file" "_site/$destination"
          done < <(jq -er '.paths[]' "$manifest")
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy update files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
